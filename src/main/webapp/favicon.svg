<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241d45"/>
      <stop offset="1" stop-color="#14111d"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6ff5"/>
      <stop offset="1" stop-color="#6d4ae0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- steam -->
  <g fill="none" stroke="#b9a6f5" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
    <path d="M25 20 q-3.5 -4 0 -8 q3.5 -4 0 -8"/>
    <path d="M35 20 q3.5 -4 0 -8 q-3.5 -4 0 -8"/>
  </g>

  <!-- handle -->
  <path d="M44 30 h3.5 a7.5 7.5 0 0 1 0 15 h-3.5" fill="none" stroke="#5a3fd0" stroke-width="4.5"/>

  <!-- mug body -->
  <path d="M14 26 h32 v11 a16 16 0 0 1 -32 0 z" fill="url(#cup)"/>
  <!-- coffee surface -->
  <ellipse cx="30" cy="26" rx="16" ry="4.6" fill="#2b2142"/>
  <!-- saucer -->
  <ellipse cx="30" cy="50" rx="20" ry="3.6" fill="#4a3a86"/>

  <!-- ladybug on the mug -->
  <g>
    <!-- legs -->
    <g stroke="#3a0d1a" stroke-width="2" stroke-linecap="round">
      <path d="M25 37 l-5 -3"/><path d="M24.5 40.5 l-5.5 0.5"/><path d="M25 44 l-5 3"/>
      <path d="M35 37 l5 -3"/><path d="M35.5 40.5 l5.5 0.5"/><path d="M35 44 l5 3"/>
    </g>
    <!-- antennae -->
    <g stroke="#3a0d1a" stroke-width="1.8" stroke-linecap="round">
      <path d="M27.5 33 l-2.5 -3.5"/><path d="M32.5 33 l2.5 -3.5"/>
    </g>
    <!-- body -->
    <ellipse cx="30" cy="41" rx="7.5" ry="9" fill="#ce2c55"/>
    <!-- wing split -->
    <path d="M30 34 v14.5" stroke="#7a1730" stroke-width="1.6"/>
    <!-- head -->
    <path d="M23.5 35 a7.5 9 0 0 1 13 0 z" fill="#2a0a14"/>
    <!-- spots -->
    <circle cx="26.5" cy="41" r="1.5" fill="#7a1730"/>
    <circle cx="33.5" cy="41" r="1.5" fill="#7a1730"/>
    <circle cx="27.5" cy="45.5" r="1.3" fill="#7a1730"/>
    <circle cx="32.5" cy="45.5" r="1.3" fill="#7a1730"/>
  </g>
</svg>
